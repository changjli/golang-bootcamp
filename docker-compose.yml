version: "3.8"

# This Docker Compose file sets up the complete local development environment

services:
  # --- Core Service Database ---
  # This PostgreSQL instance is dedicated to the core-service.
  core-db:
    image: postgres:16-alpine
    container_name: core-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: core_db
    ports:
      - "5433:5432"
    volumes:
      - core_db_data:/var/lib/postgresql/data

  # --- Payment Service Database ---
  # This is a separate PostgreSQL instance for the payment-service.
  payment-db:
    image: postgres:16-alpine
    container_name: payment-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: payment_db
    ports:
      - "5434:5432"
    volumes:
      - payment_db_data:/var/lib/postgresql/data

  # --- RabbitMQ Message Broker ---
  # This service handles asynchronous communication between the microservices.
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672" # Port for application communication (AMQP)
      - "15672:15672" # Port for the web management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS:

  core-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: core-service
    ports:
      - "8080:8080"
    environment:
      DB_HOST: core-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: core_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
    depends_on:
      - core-db
      - rabbitmq

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile.payment
    container_name: payment-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: payment-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: payment_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      APP_PORT: 8081
    depends_on:
      - payment-db
      - rabbitmq

# Define named volumes to persist database data across container restarts.
volumes:
  core_db_data:
  payment_db_data:
